# ============================================================
# 全栈部署编排：中间件 + 后端 + 前端（不使用 nginx）
#
#   浏览器 ──> frontend:3000（静态 dist + /api 反代） ──> backend:8000
#                                                         ├─> mongodb:27017
#                                                         └─> standalone:19530
#
# 启动前：
#   cp .env.example .env   # 填入 API Key，修改 MongoDB 密码
#   docker compose up -d --build
#
# 宿主机默认只暴露前端 80。中间件端口全部只在 app-net 内可达；
# 调试需要时再取消对应注释，并务必用安全组限制来源 IP。
# ============================================================

name: chongqing-ai

services:
  # ================= MongoDB（会话记忆 / 外部连接配置） =================
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    # 生产不直接暴露数据库端口；调试时取消注释
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - app-net

  # ================= Milvus 依赖组件：etcd =================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./data/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-net

  # ================= Milvus 依赖组件：MinIO =================
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      # Milvus 默认用 minioadmin / minioadmin 连接 MinIO，改这里需同步改 standalone 的凭据
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    # 调试可视化用；生产默认不暴露 MinIO 控制台
    ports:
      - "9001:9001"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-net

  # ================= Milvus 核心引擎 =================
  standalone:
    image: milvusdb/milvus:v2.6.0
    container_name: milvus-standalone
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      TZ: Asia/Shanghai
    volumes:
      - ./data/milvus/data:/var/lib/milvus
    # 生产不直接暴露 gRPC / 指标端口；调试时取消注释
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-net

  # ================= Milvus 可视化管理工具（默认不对外） =================
  attu:
    image: zilliz/attu:latest
    container_name: milvus-attu
    restart: unless-stopped
    environment:
      MILVUS_URL: standalone:19530
    # 需要 Attu 时取消注释；它没有登录鉴权，务必限制来源 IP
    ports:
      - "8001:3000"
    depends_on:
      standalone:
        condition: service_started
    networks:
      - app-net

  # ================= 后端：FastAPI =================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chongqing-ai-backend:latest
    container_name: chongqing-ai-backend
    restart: unless-stopped
    init: true
    environment:
      # 容器内走服务名，不是 localhost
      MONGO_URI: "mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-root}@mongodb:27017/?authSource=admin"
      MONGO_DB: ${MONGO_DB:-chongqing_ai}
      MILVUS_URI: http://standalone:19530
      # LLM
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # 外部 embedding（DashScope，向量检索硬依赖）
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # 决策报告可选增强
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-none}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      REPORT_ENABLED: ${REPORT_ENABLED:-true}
      TZ: Asia/Shanghai
    volumes:
      # SQLite（uploads.db / docs.db）、上传文件、知识库语料
      # 用命名卷而非 bind mount：避免宿主机目录属主导致非 root 容器不可写
      - backend_data:/app/data
    depends_on:
      mongodb:
        condition: service_healthy
      standalone:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

  # ================= 前端：Vite 构建产物 + Node 静态服务/反代 =================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chongqing-ai-frontend:latest
    container_name: chongqing-ai-frontend
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

volumes:
  backend_data:

networks:
  app-net:
    driver: bridge
